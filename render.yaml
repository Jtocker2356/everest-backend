services:
  - type: web
    name: everest-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server-ultimate.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: everest-database
          property: connectionString

databases:
  - name: everest-database
    plan: free
    region: oregon
